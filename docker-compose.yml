services:
  frontend:
    build: ./frontend
    container_name: arches-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - arches-network

  backend:
    build: ./backend
    container_name: arches-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app
    networks:
      - arches-network
    environment:
      - PYTHONUNBUFFERED=1
      # Ollama runs on the host machine, not in a container
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway" # needed on Linux; built in on Docker Desktop

networks:
  arches-network:
    driver: bridge
